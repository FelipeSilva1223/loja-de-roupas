<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nome da Loja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="/backend/config.js"></script>
    <script src="/scripts/carregar_header.js" defer></script>
    <script src="scripts/carregar_footer.js" defer></script>
</head>
<body class="min-vh-100 d-flex flex-column">
    <header></header>
    <main class="container flex-grow-1">
        <div class="row px-3" id="row_principal"></div>  
    </main>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const row = document.getElementById("row_principal");
        async function carregarCatalogo() {
            try {
                const resposta = await fetch(`${API_URL}/estoque`);

                if (!resposta.ok) {
                    throw new Error(`Erro HTTP: ${resposta.status}`);
                };
                const catalogo = await resposta.json();
                if(catalogo.length === 0){
                    const cardErro = `
                        <div class="col-12">
                            <div class="card mt-3">
                                <div class="card-body">
                                        <h4>Nenhum item encontrado</h4>
                                        <p>Tente novamente mais tarde</p>
                                </div>
                            </div>
                        </div>
                    `
                    row.insertAdjacentHTML("beforeend", cardErro);
                };
                catalogo.forEach((item) => {
                    let cardRoupa = `
                        <div class="col-6 col-sm-3 col-md-2 py-3">
                            <a href="/paginas/publico/detalhes.html?id=${item.id}" class="card-link">
                                <div class="card" id="${item.id}">
                                    <img src="${API_URL + item.img_path}" alt="${item.nome}" class="w-100" style="height: 150px; object-fit: cover;">
                                    <div class="card-body">
                                        <p class="card-title text-truncate">${item.nome}</p>
                                        <p class="card-text fw-bold text-nowrap">
                                            R$ ${(Number(item.em_liquidacao) === 1 ? item.valor_liquidado : item.valor).replace(".", ",")}
                                        </p>
                                        <button class="btn btn-custom-primary btn-sm">Comprar</button>
                                    </div>
                                </div>
                            </a>
                        </div>`;

                    row.insertAdjacentHTML("beforeend", cardRoupa);
                });

            } catch (erro) {
                console.log(erro);
                const cardErro = `
                        <div class="col-12">
                            <div class="card mt-3">
                                <div class="card-body">
                                        <h4>Não foi possível se conectar com o servidor</h4>
                                        <p>Tente novamente mais tarde</p>
                                </div>
                            </div>
                        </div>
                    `
                    row.insertAdjacentHTML("beforeend", cardErro);
            };
        };
        carregarCatalogo();
    </script>
</body>
</html>
