<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de roupa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="scripts/carregar_header.js" defer></script>
    <script src="scripts/carregar_footer.js" defer></script>
</head>
<body class="min-vh-100 d-flex flex-column">
    <header id="header">

    </header>
    <main class="container flex-grow-1">
        <div class="row" id="row_principal">

        </div>  
    </main>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        localStorage.setItem('roupas', JSON.stringify([{'id':'1', 'nome': 'Vestido Rosa', 'valor': '100', 'descricao': 'Um vestido rosa de exemplo', 'detalhes': 'Ilustrado com arte digital'},
                                                        {'id':'2', 'nome': 'Blusinha Rosa', 'valor': '100', 'descricao': 'Uma blusinha rosa de exemplo', 'detalhes': 'Ilustrado com arte digital'},
                                                        {'id':'3', 'nome': 'Camisa Branca', 'valor': '200', 'descricao': 'Uma camisa branca de exemplo', 'detalhes': 'Ilustração realista'},
                                                        {'id':'4', 'nome': 'Saia Preta', 'valor': '150', 'descricao': 'Uma saia preta de exemplo', 'detalhes': 'Ilustração realista'}]))
        const catalogo = JSON.parse(localStorage.getItem("roupas"))
        const row = document.getElementById("row_principal")
        catalogo.forEach((item, i) => {
            let cardRoupa = `<div class="col-6 col-sm-3 col-md-2 py-3">
                                <a href="paginas/publico/detalhes.html?id=${item.nome}" class="card-link">
                                    <div class="card">
                                        <img src="imagens/${item.nome}.png" alt="${item.nome}" class="w-100" style="height: 150px; object-fit: cover;">
                                        <div class="card-body">
                                            <p class="card-title text-truncate">${item.nome}</p>
                                            <p class="card-text fw-bold text-nowrap">R$ ${item.valor}</p>
                                        </div>
                                    </div>
                                </a>    
                            </div> `
            row.insertAdjacentHTML("beforeend", cardRoupa);
        })
    </script>
</body>
</html>
