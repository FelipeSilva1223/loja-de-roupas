<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../scripts/auth.js"></script>
    <script src="../../scripts/carregar_header.js" defer></script>
    <script src="../../scripts/carregar_sidebar.js" defer></script>
</head>
<body class="min-vh-100 d-flex flex-column">
    <header id="header">

    </header>
    <main>
        <div class="d-flex">
            <div class="sidebar border">
                
            </div>
            <div class="container">
                <div>
                    <div class="card mt-2 p-2">
                        <div class="card-body">
                            <h5 class="card-title">Adicionar peça</h5>
                            <form>
                                <input type="file" accept="image/*" multiple id="img_input" class="form-control">
                                <div id="container_previa" class="d-flex m-2">

                                </div>
                                <div class="mb-3">
                                    <label for="nome" class="form-label">Nome da peça</label>
                                    <input type="text" class="form-control" id="nome">
                                </div>
                                <div class="mb-3">
                                    <span class="form-label">Valor</span>
                                    <input type="text" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <span class="form-label">Descrição</span>
                                    <textarea name="descricao" id="descricao" class="form-control"></textarea>
                                </div>
                                <div class="d-flex justify-content-end gap-2">
                                    <button type="button" class="btn btn-outline-secondary">
                                        Cancelar
                                    </button>

                                    <button type="submit" class="btn btn-primary px-4">
                                        Salvar
                                    </button>
                                </div>
                            </form>
                        </div>       
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const inputImg = document.getElementById("img_input");
        const containerPrevia = document.getElementById("container_previa");
        const imagensSelecionadas = [];

        inputImg.addEventListener("change", function(){
            const arquivos = Array.from(this.files);

            arquivos.forEach(arquivo => {
                if (!arquivo.type.startsWith("image/")) { return}

                imagensSelecionadas.push(arquivo);
            });

            renderizarImagens();
            this.value = ""
        });

        function renderizarImagens() {
            containerPrevia.innerHTML = "";

            imagensSelecionadas.forEach((arquivo, index) => {
                const url = URL.createObjectURL(arquivo);

                const div = document.createElement("div");
                div.className = "previa_item position-relative border rounded overflow-hidden";
                div.innerHTML = ` <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1 btn-remover" data-index="${index}">×</button> 
                                  <img src="${url}" alt="Imagem selecionada"  width="100" height="100" class="m-2"> `;
                
                containerPrevia.appendChild(div);                  
                });
            adicionarEventoRemover();
        }

        function adicionarEventoRemover(){
            const botoesRemover = document.querySelectorAll(".btn-remover");

            botoesRemover.forEach(botao => {
                botao.addEventListener("click", function (){
                    const index = Number(this.dataset.index);
                    imagensSelecionadas.splice(index, 1);
                    renderizarImagens();
                });
            });
        }
    </script>
</body>
</html>
