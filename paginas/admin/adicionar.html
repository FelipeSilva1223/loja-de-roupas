<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/backend/config.js"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/carregar_header.js" defer></script>
    <script src="/scripts/carregar_sidebar.js" defer></script>
</head>
<body class="min-vh-100 d-flex flex-column">
    <header>

    </header>
    <main>
        <div class="d-flex">
            <div class="sidebar border">
                
            </div>
            <div class="container">
                <div>
                    <div class="card mt-3 p-2">
                        <div class="card-body">
                            <h5 class="card-title">Adicionar peça</h5>
                            <form id="formulario" autocomplete="off">
                                <input type="file" accept="image/*" multiple id="img_input" class="form-control">
                                <div id="container_previa" class="d-flex m-2">

                                </div>
                                <div class="mb-3">
                                    <label for="nome" class="form-label">Nome da peça</label>
                                    <input type="text" class="form-control" id="nome" required>
                                </div>
                                <div class="mb-3">
                                    <span class="form-label">Valor</span>
                                    <input type="number" step="0.01" min="0" class="form-control" id="valor" required>
                                </div>
                                <div class="mb-3">
                                    <span class="form-label">Detalhes</span>
                                    <textarea name="detalhes" id="detalhes" class="form-control" required></textarea>
                                </div>
                                <div class="d-flex justify-content-end gap-2">
                                    <button type="button" class="btn btn-secondary" id="btn_cancelar_form">
                                        Cancelar
                                    </button>

                                    <button type="submit" class="btn btn-primary px-4">
                                        Salvar
                                    </button>
                                </div>
                            </form>
                        </div>       
                    </div>
                    <div class="card my-3 p-2">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Fretes</h5>
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>Bairro</th>
                                        <th>Valor</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody_frete">
                                </tbody>
                            </table>
                            <button type="button" class="btn btn-primary btn-sm mb-2" id="btn_add_bairro">Adicionar bairro</button>
                            <button type="button" class="btn btn-primary btn-sm mb-2" id="btn_edit_frete">Editar valor</button>

                            <div class="mb-3 pt-2 d-none" id="div_novo_bairro">
                                <h4>Adicionar bairro</h4>
                                <label for="nbairro_nome" class="form-label">Nome</label>
                                <div class="input-group">
                                    <input type="text" class="form-control mb-2" id="nbairro_nome">
                                </div>
                                <label for="nbairro_valor" class="form-label">Valor</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="nbairro_valor">
                                </div>
                                <div class="m-2">
                                    <button type="button" class="btn btn-primary btn-sm" id="btn_salvar_add">Salvar</button>
                                    <button type="button" class="btn btn-secondary btn-sm" id="btn_cancelar_add">Cancelar</button>
                                </div>
                            </div>
                            <div class="mb-3 pt-2 d-none" id="div_edit_bairro">
                                <h4>Editar valor</h4>
                                <span>Bairro</span>
                                <select name="bairros" id="bairros" class="form-select my-2"></select>
                                <label for="novo_valor" class="form-label">Novo valor</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="novo_valor">
                                </div>
                                <div class="m-2">
                                    <button type="button" class="btn btn-primary btn-sm" id="btn_salvar_edit">Salvar</button>
                                    <button type="button" class="btn btn-secondary btn-sm" id="btn_cancelar_edit">Cancelar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/scripts/admin/adicionar.js"></script>
</body>
</html>
