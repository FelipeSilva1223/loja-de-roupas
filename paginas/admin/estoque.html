<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../scripts/auth.js"></script>
    <script src="../../scripts/carregar_header.js" defer></script>
    <script src="../../scripts/carregar_sidebar.js" defer></script>
</head>
<body class="min-vh-100 d-flex flex-column">
    <header id="header">

    </header>
    <main>
        <div class="d-flex">
            <div class="sidebar border"></div>
            <div class="flex-grow-1" style="min-width: 0;">
                <div class="container card p-2 mt-2">
                    <div class="row">
                         <div class="col-12">
                            <h1>Estoque de peças</h1>
                        </div>
                        <div class="col-sm-4 order-sm-2" id="card_detalhes">

                        </div>
                        <div class="col-sm-8 order-sm-1">
                            <div class="card rounded-0 mt-2">
                                <div class="card-body">
                                    <div class="list-group" id="lista_estoque"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const estoque = JSON.parse(localStorage.getItem('roupas'))
        const divLista = document.getElementById('lista_estoque')
        const cardDetalhes = document.getElementById('card_detalhes')

        estoque.forEach(roupa => {
            if (estoque && estoque.length > 0) {
                selecionarItem(estoque[0])

                const primeiroBotao = document.querySelector('#lista_estoque button')
                if (primeiroBotao) {
                    primeiroBotao.classList.add('active')
                }
            }
            const botao = document.createElement('button')
            botao.id = roupa.id
            botao.classList.add('list-group-item')
            botao.classList.add('list-group-item-action')
            botao.innerText = roupa.nome
            botao.addEventListener('click', function(){
                document.querySelectorAll('#lista_estoque button')
                .forEach(btn => btn.classList.remove('active'))
                botao.classList.add('active')
                selecionarItem(roupa)
            })
            divLista.insertAdjacentElement('beforeend', botao)
        })

        function selecionarItem(item){
            let html = `
                            <div class="card mt-2">
                                <img src="../../imagens/${item.nome}.png" alt="vestido" style="max-width: 500px; max-height: 300px;">
                                <div class="m-2">
                                    <button type="button" class="btn btn-secondary btn-sm mt-1">Editar</button>
                                    <button type="button" class="btn btn-danger btn-sm mt-1">Apagar</button>
                                    <button type="button" class="btn btn-warning btn-sm mt-1">Liquidar</button>
                                </div>
                                <div class="card-body" id="card_detalhes">
                                    <h5 class="card-title">${item.nome}</h5>
                                    <h5>Valor: ${item.valor}</h5>
                                    <p>${item.descricao}</p>
                                </div>
                            </div>`
            cardDetalhes.innerHTML = html
        }
    </script>
</body>
</html>
