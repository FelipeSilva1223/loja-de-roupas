<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historico de pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../scripts/auth.js"></script>
    <script src="../../scripts/carregar_header.js" defer></script>
    <script src="../../scripts/carregar_sidebar.js" defer></script>
</head>
<body class="min-vh-100 d-flex flex-column">
    <header id="header">

    </header>
    <main>
        <div class="d-flex">
            <div class="sidebar border">
                
            </div>
            <div class="flex-grow-1">
                <div class="container">
                    <div class="card mt-2">
                        <div class="card-body">
                            <h1 class="card-title">Histórico de pedidos</h1>
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Cliente</th>
                                        <th>Data</th>
                                        <th style="width: 80px;">Status</th>
                                        <th style="width: 80px;">#</th>
                                    </tr>
                                </thead>
                                <tbody class="table-group-divider">
                                    <tr>
                                        <th>2</th>
                                        <td>Cliente exemplo</td>
                                        <td>01/01/2000</td>
                                        <td class="text-success fw-bold">Concluído</td>
                                        <td>
                                            <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#modal_detalhes">Detalhes</button>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>3</th>
                                        <td>Cliente exemplo</td>
                                        <td>01/01/2000</td>
                                        <td class="text-danger fw-bold">Cancelado</td>
                                        <td style="width: 80px;">
                                            <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#modal_detalhes">Detalhes</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MODAL DETALHES DA VENDA -->

         <div class="modal fade" id="modal_detalhes" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Cliente 1</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>Nome do cliente</p>
                        <p>01/01/2000</p>
                        <p>Itens: Item 1, Item 2, Item 3</p>
                        <p>Valor total: R$ 297,00</p>
                        <p>Forma de pagamento: Pix</p>
                    </div>
                </div>
            </div>
         </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
