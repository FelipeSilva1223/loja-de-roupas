<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital@1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../scripts/auth.js"></script>
    <script src="../../scripts/carregar_header.js" defer></script>
    <script src="../../scripts/carregar_sidebar.js" defer></script>
</head>

<body class="min-vh-100 d-flex flex-column">
    <header id="header">

    </header>
    <main>
        <div class="d-flex">
            <div class="sidebar border">
                
            </div>
            <div class="flex-grow-1">
                <div class="container">
                    <div class="row">
                        <div class="col-12 d-flex flex-column">
                            <div class="card m-2" style="background-color: #fff;">
                                <div class="card-body d-flex flex-column gap-2">
                                    <div class="col">
                                        <div class="col">
                                            <div class="card-body text-center mb-2 border">
                                                <h1>Entregas a fazer</h1>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card">
                                        <div class="d-flex align-items-center">
                                            <button class="btn btn-secondary m-1 text-start flex-grow-1" type="button"
                                                data-bs-toggle="collapse" data-bs-target="#entrega-1">Cliente 1</button>
                                            <div class="form-check form-check-reverse mx-2">
                                                <input type="checkbox" id="check-1" class="form-check-input">
                                                <label for="check-1" class="form-check-label">Entregue</label>
                                            </div>
                                        </div>
                                        <div class="collapse m-1" id="entrega-1">
                                            <div class="card-text p-2">
                                                <p>Endereço: Rua Silvio Alexandre N° 230, Barra do Riacho - Aracruz/ES
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card">
                                        <div class="d-flex align-items-center">
                                            <button class="btn btn-secondary m-1 text-start flex-grow-1" type="button"
                                                data-bs-toggle="collapse" data-bs-target="#entrega-2">Cliente 2</button>
                                            <div class="form-check form-check-reverse mx-2">
                                                <input type="checkbox" id="check-2" class="form-check-input">
                                                <label for="check-2" class="form-check-label">Entregue</label>
                                            </div>
                                        </div>
                                        <div class="collapse m-1" id="entrega-2">
                                            <div class="card-text p-2">
                                                <p>Endereço: Rua Silvio Alexandre N° 230, Barra do Riacho - Aracruz/ES
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12 text-center">
                            <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modal_salvar">Salvar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- MODAL SALVAR -->
         
         <div class="modal fade" id="modal_salvar" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Entregas concluídas</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>Cliente 1</p>
                        <p>Cliente 2</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary">Salvar</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    </div>
                </div>
            </div>
         </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
