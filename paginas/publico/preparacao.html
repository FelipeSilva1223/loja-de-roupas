<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Recebido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../scripts/carregar_header.js" defer></script>
</head>
<body class="min-vh-100 d-flex flex-column">
    <header id="header">

    </header>
    <main class="flex-grow-1 d-flex flex-column">
        <div class="container">
            <div class="row">
                <div class="col-2">

                </div>
                <div class="col-8">
                    <div class="card mt-4 p-2">
                        <div class="card-body">
                            <h5 class="card-title fw-bold">Resumo</h5>
                            <div class="card mt-3 p-2" id="resumo">
                                
                            </div>
                        </div>
                    </div>
                    <div class="card mt-4 p-2">
                        <div class="card-body text-center">
                            <h5 class="card-title fw-bold">Pedido recebido</h5>
                            <img src="/imagens/qr code exemplo.png" alt="QR Code" width="120" height="120">
                            <div class="card mt-3">
                                <div class="card-body">
                                    <h5>Pix Copia e Cola</h5>
                                    <textarea id="codigo_pix" class="form-control" rows="2" readonly>00020126580014BR.GOV.BCB.PIX0114+55119999999995204000053039865802BR5920LOJA EXEMPLO6009SAO PAULO62070503***6304ABCD</textarea><button type="button"id="btn_copiar_pix"class="btn btn-outline-secondary mt-3 w-100">Copiar código Pix</button>
                                </div>
                            </div>
                            <p class="pt-2">Envie o comprovante para <strong>wa.me/exemplo</strong></p>
                        </div>
                    </div>
                </div>
                <div class="col-2">
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const mensagem = JSON.parse(sessionStorage.getItem('mensagem'))
        const div = document.getElementById('resumo')
        let pag = ''
        let ent = ''
        if(mensagem.formaPagamento === "Crédito"){
        pag = `Forma de pagamento: Crédito<br>Parcelas ${mensagem.parcelas} vezes de R$: ${(Number(mensagem.total)/Number(mensagem.parcelas)).toFixed(2).replace(".", ",")}`
        } else {
            pag = `Forma de pagamento: ${mensagem.formaPagamento}`
        };
        if(mensagem.modoEntrega === "Entrega"){
            ent = `Endereço: ${mensagem.endereco}`
        } else {
            ent = "Retirada"
        };
        let resumo = `Id: ${mensagem.id}<br>${ent}<br>${pag}<br>Total: R$: ${Number(mensagem.total).toFixed(2).replace(".", ",")}`
        div.innerHTML = resumo;
        sessionStorage.removeItem('carrinho')

        document.getElementById("btn_copiar_pix").addEventListener("click", async function () {

            const codigo = document.getElementById("codigo_pix").value;
            const botao = this;

            try {
                await navigator.clipboard.writeText(codigo);

                botao.textContent = "Código copiado";
                botao.classList.remove("btn-outline-secondary");
                botao.classList.add("btn-outline-primary");

                setTimeout(() => {
                    botao.textContent = "Copiar código Pix";
                    botao.classList.remove("btn-outline-primary");
                    botao.classList.add("btn-outline-secondary");
                }, 2000);

            } catch (erro) {
                alert("Não foi possível copiar.");
            }

        });
    </script>
</body>
</html>
