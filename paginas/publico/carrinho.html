<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/backend/config.js"></script>
    <script src="/scripts/carregar_header.js" defer></script>
    <script src="/scripts/carregar_footer.js" defer></script>
</head>
<body class="min-vh-100 d-flex flex-column">
    <header id="header">
    </header>
    <main class="container flex-grow-1 d-flex flex-column">
        <div id="carrinho_vazio" class="card mt-3  d-none">
            <div card-body>
                <p class="text-center my-1">Carrinho vazio</p>
            </div>
        </div>
        <div id="btn_ir_as_compras" class="card mt-3  d-none">
            <a href="/index.html" class="btn btn-custom-primary">Ir as compras</a>
        </div>
        <div id="div_principal">
            
        </div>
        <div class="d-flex justify-content-center col-12 mt-3">
            <button id="btn_esvaziar" class="btn btn-custom-success col-4" onclick="esvaziar()">Esvaziar carrinho</button>
        </div>
        <div class="d-flex justify-content-center col-12 mt-3">
            <span id="total_span" class="btn btn-outline-secondary col-6">Total: R$ <span id="total_carrinho"></span></span>
        </div>
        <div class="d-flex justify-content-center col-12 mt-1 mb-3">
            <button class="btn btn-custom-primary col-6" id="btn_finalizar" onclick="finalizar()">Finalizar Compra</button>
        </div>
    </main>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/scripts/publico/carrinho.js"></script>
</body>
</html>
