<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/backend/config.js"></script>
    <script src="/scripts/carregar_header.js" defer></script>
    <script src="/scripts/carregar_footer.js" defer></script>
    <script src="/scripts/publico/finalizar-compra.js" defer></script>
</head>
<body class="min-vh-100 d-flex flex-column">
    <header></header>
    <main class="container flex-grow-1">
        <div>
            <form class="needs-validation" id="formulario">
                <div class="row m-3">
                    <div class="card mt-3">
                        <div class="card-body">
                            <div class="form-check">
                                <input type="radio" id="radio_entrega" name="radio" class="form-check-input" required>
                                <label for="radio_entrega" class="form-check-label">Entrega</label>
                            </div>
                            <div class="form-check">
                                <input type="radio" id="radio_retirada" name="radio" class="form-check-input" requried>
                                <label for="radio_retirada" class="form-check-label">Retirada</label>
                            </div>
                        </div>
                        <div id="card_endereco" class="card-body d-none">
                            <div class="input-group">
                                <span class="input-group-text">Endereço</span>
                                <input type="text" class="form-control" id="endereco" name="endereco" maxlength="150">
                            </div>
                            <div class="mt-3">
                                <span>Bairro:</span>
                                <select name="bairro" id="bairro" class="form-select"></select>
                            </div>
                        </div>
                    </div>
                    <div class="card mt-3">
                        <div class="card-body">
                            <h5>Forma de pagamento</h5>
                            <div class="mt-3">
                                <select name="forma_de_pagamento" id="forma_de_pagamento" class="form-select" style="max-width: 150px;" required>
                                    <option value="Pix">Pix</option>
                                    <option value="Débito">Débito</option>
                                    <option value="Crédito">Crédito</option>
                                    <option value="A combinar">A combinar</option>
                                </select>
                                <select name="qtd_parcelas" id="qtd_parcelas" class="form-select mt-2 d-none" style="max-width: 150px;" required>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="card mt-3" id="card_produtos">
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn btn-success my-3" data-bs-toggle="modal" data-bs-target="#modal_salvar">Finalizar compra</button>
                    </div>
                </div>
            </form>
            <div class="modal fade" id="modal_salvar" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Insira dados de contato</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body" id="modal-body">
                            <div class="mb-3">
                                <label for="input_nome" class="form-label">Nome</label>
                                <input type="text" id="input_nome" class="form-control" maxlength="80" required>
                                <div class="invalid-feedback" id="erro_nome">
                                    Informe seu nome.
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="input_telefone" class="form-label">Telefone</label>
                                <input type="number" id="input_telefone" class="form-control" maxlength="20" required>
                                <div class="invalid-feedback" id="erro_tel">
                                    Informe seu telefone.
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-primary" id="btn_confirmar">Confirmar</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btn_cancelar">Cancelar</button>
                        </div>
                    </div>
                </div>
            </div>
    </main>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
